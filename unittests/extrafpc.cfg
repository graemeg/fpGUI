#
# fpc.cfg for Free Pascal Compiler - fpGUI Unit Tests
#

# nested #IFNDEF, #IFDEF, #ENDIF, #ELSE, #DEFINE, #UNDEF are allowed
#
# -d is the same as #DEFINE
# -u is the same as #UNDEF
#

#    * * *       I M P O R T A N T       * * *
# You need to specify which backend you are compiling for
#
# Your options are:
#  -dX11             for X11 support (eg: Linux or FreeBSD)
#  -dGDI             for Windows GDI support
#  -dCocoa           for Mac OS X Carbon support
#  -dAGGCanvas       for the experimental AggPas-enabled Canvas support
#


# Force always building all units
-B

# Turn on Object Pascal extensions by default
-Mobjfpc

# Allow inline and use ansistrings.
-Sih

# Allows C-style assignment += -= etc.
-Sc


# Slashes are also allowed under DOS-like systems
# searchpath for include files
-Fi.
-Fi../src
-Fi../src/corelib
#IFDEF X11
  -Fi../src/corelib/x11/
#ENDIF
#IFDEF GDI
  -Fi../src/corelib/gdi/
#ENDIF
#IFDEF Cocoa
  #DEFINE AggCanvas
  -Fi../src/corelib/cocoa/
#ENDIF
-Fi../src/corelib/render/software


# searchpath for units and other system dependent things
-Fu.
-Fu../src/corelib
#IFDEF X11
  -Fu../src/corelib/x11/
#ENDIF
#IFDEF GDI
  -Fu../src/corelib/gdi/
#ENDIF
#IFDEF Cocoa
  #DEFINE AggCanvas
  -Fu../src/corelib/cocoa/
#ENDIF
-Fu../src/gui/
-Fu../src/gui/db/
-Fu../src/reportengine/
-Fu../src/corelib/render/software/
-Fu../src/3rdparty/regex
-Futests


# Unit output path (for compiled test units)
-FUunits/

# Library search paths and linker options
#IFDEF X11
  #IFDEF DARWIN
    # XQuartz library path on macOS
    -Fl/opt/X11/lib
    -Fl/opt/homebrew/lib
    # Explicitly link freetype library
    -k-lfreetype
  #ENDIF
#ENDIF

# Generate debugging information (slows down the compiling process)
# Enable debug info and use the line info unit by default
# heaptraces (disabled - expected leaks from fpGUI application cleanup)
#-gh
# lineinfo in heap traces
-gl
# DWARF format debugging
-gw

# Always strip debuginfo from the executable
#-Xs


# Write always a nice FPC logo ;)
#-l


# Verbose compiler output
# Display Info, Warnings, Notes and Hints
#-viwn
#
# If you don't want so much verbosity use
#-vw
#
# Show only errors
-ve


# Disable all optimization
-O-
